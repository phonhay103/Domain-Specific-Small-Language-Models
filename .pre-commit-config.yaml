# Secret scanning on every commit (https://github.com/gitleaks/gitleaks).
# One-time setup per clone:  pre-commit install
# The hook builds gitleaks with the Go toolchain on first run, so Go must be
# on PATH; the built binary is cached afterwards.
# Only staged changes are scanned, and matches are redacted in the output.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Project's own linters, run through uv so the ruff/ty versions pinned in
  # uv.lock are the ones enforced (same as `make lint`).
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: uv run --frozen ruff format --check --force-exclude
        language: system
        types: [python]
      - id: ty
        name: ty check
        entry: uv run --frozen ty check
        language: system
        pass_filenames: false
        types: [python]
